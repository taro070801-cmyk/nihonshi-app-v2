<script>
  // 1. 問題データサンプル（データ構造を正規化）
  const QUESTIONS = [
    { "id": 1, "star": 1, "era": "Ⅰ 原始時代", "item": "1 日本文化のあけぼの", "question": "人類の祖先が地球上に現れるのは、今から約（）年前と言われている。", "answer": "700万", "explanation": "直立二足歩行と道具の使用が特徴です。" },
    { "id": 2, "star": 3, "era": "Ⅰ 原始時代", "item": "1 日本文化のあけぼの", "question": "地質年代の第四紀は、およそ1万年前を境に、（）と（）に二分される。", "answer": "更新世、完新世", "explanation": "更新世は氷河時代とも呼ばれます。" }
  ];

  // 2. カテゴリマップ定義
  const CATEGORY_MAP = [
    { part: "第1部 原始・古代", era: "Ⅰ 原始時代", item: "1 日本文化のあけぼの" },
    { part: "第1部 原始・古代", era: "Ⅰ 原始時代", item: "2 縄文文化の成立" },
    { part: "第1部 原始・古代", era: "Ⅰ 原始時代", item: "3 弥生文化の成立" }
  ];

  // 3. アプリのグローバル状態
  let currentQuestions = [];
  let currentIndex = 0;
  let history = JSON.parse(localStorage.getItem('history') || '{}');

  // 初期化処理
  window.addEventListener('DOMContentLoaded', () => {
    initCategorySelects();
    updateStats();
    renderSearch();
  });

  // カテゴリ選択肢の初期化と連動
  function initCategorySelects() {
    const partSelect = document.getElementById('partSelect');
    const eraSelect = document.getElementById('eraSelect');
    const itemSelect = document.getElementById('itemSelect');

    if (!partSelect || !eraSelect || !itemSelect) return;

    const uniqueParts = [...new Set(CATEGORY_MAP.map(m => m.part))];
    partSelect.innerHTML = '<option value="ALL">すべて（全範囲）</option>';
    uniqueParts.forEach(p => {
      partSelect.innerHTML += `<option value="${p}">${p}</option>`;
    });

    partSelect.onchange = () => {
      const selectedPart = partSelect.value;
      eraSelect.innerHTML = '<option value="ALL">すべて</option>';
      itemSelect.innerHTML = '<option value="ALL">すべて</option>';

      let filtered = CATEGORY_MAP;
      if (selectedPart !== 'ALL') {
        filtered = filtered.filter(m => m.part === selectedPart);
      }

      const uniqueEras = [...new Set(filtered.map(m => m.era))];
      uniqueEras.forEach(e => {
        eraSelect.innerHTML += `<option value="${e}">${e}</option>`;
      });

      eraSelect.onchange();
    };

    eraSelect.onchange = () => {
      const selectedPart = partSelect.value;
      const selectedEra = eraSelect.value;
      itemSelect.innerHTML = '<option value="ALL">すべて</option>';

      let filtered = CATEGORY_MAP;
      if (selectedPart !== 'ALL') {
        filtered = filtered.filter(m => m.part === selectedPart);
      }
      if (selectedEra !== 'ALL') {
        filtered = filtered.filter(m => m.era === selectedEra);
      }

      const uniqueItems = [...new Set(filtered.map(m => m.item))];
      uniqueItems.forEach(i => {
        itemSelect.innerHTML += `<option value="${i}">${i}</option>`;
      });
    };

    partSelect.onchange();
  }

  // 星ボタンのトグル
  function toggleStarBtn(el) {
    el.classList.toggle('active');
  }

  function getSelectedStars() {
    const activeBtns = document.querySelectorAll('.star-btn.active');
    return Array.from(activeBtns).map(btn => parseInt(btn.getAttribute('data-star')));
  }

  // タブ切り替え
  function switchTab(tabName) {
    document.querySelectorAll('#tabBar .tab').forEach(t => t.classList.remove('active'));
    const views = ['Home', 'Progress', 'Review', 'Search'];
    views.forEach(v => document.getElementById('view' + v).style.display = 'none');
    document.getElementById('quizView').style.display = 'none';

    if (tabName === 'home') {
      document.querySelectorAll('#tabBar .tab')[0].classList.add('active');
      document.getElementById('viewHome').style.display = 'block';
    } else if (tabName === 'progress') {
      document.querySelectorAll('#tabBar .tab')[1].classList.add('active');
      document.getElementById('viewProgress').style.display = 'block';
      renderProgress();
    } else if (tabName === 'review') {
      document.querySelectorAll('#tabBar .tab')[2].classList.add('active');
      document.getElementById('viewReview').style.display = 'block';
      renderReview();
    } else if (tabName === 'search') {
      document.querySelectorAll('#tabBar .tab')[3].classList.add('active');
      document.getElementById('viewSearch').style.display = 'block';
    }
  }

  // 問題オブジェクトからカテゴリ情報を取得（修正済み）
  function getQuestionCategory(q) {
    if (!q) return { part: '', era: '', item: '' };
    const cat = CATEGORY_MAP.find(c => c.item === q.item || c.era === q.era);
    if (cat) return cat;
    return {
      part: q.part || '',
      era: q.era || '',
      item: q.item || ''
    };
  }

  // 全体正答率＆時代別グラフの更新
  function updateStats() {
    const keys = Object.keys(history);
    if (keys.length === 0) {
      document.getElementById('statsAccuracy').textContent = '0';
    } else {
      const corrects = keys.filter(k => history[k] === true).length;
      const rate = Math.round((corrects / keys.length) * 100);
      document.getElementById('statsAccuracy').textContent = rate;
    }
    renderEraStats();
  }

  // 時代別正答率の描画
  function renderEraStats() {
    const container = document.getElementById('eraStatsList');
    if (!container) return;

    const eraMap = {};
    if (typeof QUESTIONS !== 'undefined') {
      QUESTIONS.forEach(q => {
        const isAnswered = history[q.id] !== undefined;
        if (isAnswered) {
          const cat = getQuestionCategory(q);
          const eraName = cat.era || q.era || 'その他';

          if (!eraMap[eraName]) {
            eraMap[eraName] = { correct: 0, total: 0 };
          }
          eraMap[eraName].total += 1;
          if (history[q.id] === true) {
            eraMap[eraName].correct += 1;
          }
        }
      });
    }

    const eras = Object.keys(eraMap);
    if (eras.length === 0) {
      container.innerHTML = '<p style="color: #666; font-size: 0.9em;">まだ解答データがありません。</p>';
      return;
    }

    let html = '<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">';
    eras.forEach(era => {
      const data = eraMap[era];
      const rate = Math.round((data.correct / data.total) * 100);
      let badgeColor = '#34c759';
      let label = '良好';
      if (rate < 60) {
        badgeColor = '#ff3b30';
        label = '⚠️ 苦手';
      } else if (rate < 80) {
        badgeColor = '#ff9500';
        label = '要確認';
      }

      html += `
        <div style="border: 1px solid #eee; padding: 8px 12px; border-radius: 8px; background: #fafafa;">
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; font-weight: bold; margin-bottom: 4px;">
            <span>${era}</span>
            <span style="color: ${badgeColor};">${label} (${rate}%)</span>
          </div>
          <div style="background: #e5e5ea; height: 6px; border-radius: 3px; overflow: hidden;">
            <div style="background: ${badgeColor}; width: ${rate}%; height: 100%;"></div>
          </div>
        </div>
      `;
    });
    html += '</div>';
    container.innerHTML = html;
  }

  // 進捗画面の描画
  function renderProgress() {
    const keys = Object.keys(history);
    const total = QUESTIONS.length;
    const answered = keys.length;
    const correct = keys.filter(k => history[k] === true).length;
    const incorrect = answered - correct;

    document.getElementById('progTotal').textContent = total;
    document.getElementById('progAnswered').textContent = answered;
    document.getElementById('progCorrect').textContent = correct;
    document.getElementById('progIncorrect').textContent = incorrect;

    [3, 2, 1, 0].forEach(star => {
      const starQs = QUESTIONS.filter(q => q.star === star);
      const starAns = starQs.filter(q => history[q.id] !== undefined);
      const starCorr = starQs.filter(q => history[q.id] === true);
      const rate = starAns.length ? Math.round((starCorr.length / starAns.length) * 100) : 0;
      document.getElementById(`rateStar${star}`).textContent = `${rate}% (${starCorr.length}/${starAns.length}問正解)`;
    });
  }

  // 復習画面の描画
  function renderReview() {
    const mistaken = QUESTIONS.filter(q => history[q.id] === false).length;
    const unanswered = QUESTIONS.filter(q => history[q.id] === undefined).length;
    document.getElementById('countMistaken').textContent = mistaken;
    document.getElementById('countUnanswered').textContent = unanswered;
  }

  function startQuickQuiz(mode) {
    document.getElementById('modeSelect').value = mode;
    switchTab('home');
    startQuiz();
  }

  // 検索画面の描画
  function renderSearch() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const resultsEl = document.getElementById('searchResults');
    
    const filtered = QUESTIONS.filter(q => {
      if (!query) return true;
      return q.question.toLowerCase().includes(query) || 
             q.answer.toLowerCase().includes(query) || 
             (q.era && q.era.toLowerCase().includes(query));
    });

    if (filtered.length === 0) {
      resultsEl.innerHTML = '<p style="color:#8e8e93;">該当する問題が見つかりません。</p>';
      return;
    }

    resultsEl.innerHTML = filtered.map(q => `
      <div class="search-item">
        <span class="badge">${q.era || '全体'}</span>
        <span class="badge" style="background:#fff3c4; color:#996600;">${'★'.repeat(q.star || 0) || '無印'}</span>
        <div class="search-q">${q.question}</div>
        <div class="search-a">答: ${q.answer}</div>
        ${q.explanation ? `<div style="font-size:12px; color:#666; margin-top:2px;">${q.explanation}</div>` : ''}
      </div>
    `).join('');
  }

  // クイズ開始処理（修正済み）
  function startQuiz() {
    const selectedStars = getSelectedStars();
    const partVal = document.getElementById('partSelect').value;
    const eraVal = document.getElementById('eraSelect').value;
    const itemVal = document.getElementById('itemSelect').value;
    const mode = document.getElementById('modeSelect').value;
    const countVal = document.getElementById('countSelect').value;

    if (selectedStars.length === 0) {
      alert('星を最低1つ以上選択してください。');
      return;
    }

    let filtered = QUESTIONS.filter(q => {
      if (!selectedStars.includes(q.star)) return false;

      // 修正: q オブジェクトを直接渡す
      const cat = getQuestionCategory(q);

      if (partVal !== 'ALL' && cat.part !== partVal) return false;
      if (eraVal !== 'ALL' && cat.era !== eraVal) return false;
      if (itemVal !== 'ALL' && cat.item !== itemVal) return false;

      if (mode === 'unanswered' && history[q.id] !== undefined) return false;
      if (mode === 'mistaken' && history[q.id] !== false) return false;

      return true;
    });

    if (filtered.length === 0) {
      alert('条件に一致する問題がありません。');
      return;
    }

    filtered.sort(() => Math.random() - 0.5);

    if (countVal !== 'all') {
      filtered = filtered.slice(0, parseInt(countVal));
    }

    currentQuestions = filtered;
    currentIndex = 0;

    document.getElementById('viewHome').style.display = 'none';
    document.getElementById('quizView').style.display = 'block';
    loadQuestion();
  }

  function loadQuestion() {
    if (currentIndex >= currentQuestions.length) {
      alert('すべての問題が終了しました！');
      exitQuiz();
      return;
    }

    const q = currentQuestions[currentIndex];
    document.getElementById('eraBadge').textContent = q.era || '時代';
    document.getElementById('starBadge').textContent = '★'.repeat(q.star) || '無印';
    document.getElementById('progressText').textContent = `${currentIndex + 1} / ${currentQuestions.length}`;
    document.getElementById('qText').textContent = q.question;
    
    document.getElementById('aText').textContent = '答: ' + q.answer;
    document.getElementById('aText').style.display = 'none';
    
    const expEl = document.getElementById('expText');
    if (q.explanation) {
      expEl.textContent = '【解説】' + q.explanation;
    } else {
      expEl.textContent = '';
    }
    expEl.style.display = 'none';

    document.getElementById('ansBtn').style.display = 'block';
    document.getElementById('judgeBtns').style.display = 'none';
  }

  function showAnswer() {
    document.getElementById('aText').style.display = 'block';
    if (document.getElementById('expText').textContent) {
      document.getElementById('expText').style.display = 'block';
    }
    document.getElementById('ansBtn').style.display = 'none';
    document.getElementById('judgeBtns').style.display = 'block';
  }

  function answerQuestion(isCorrect) {
    const q = currentQuestions[currentIndex];
    history[q.id] = isCorrect;
    localStorage.setItem('history', JSON.stringify(history));
    updateStats();

    currentIndex++;
    loadQuestion();
  }

  function exitQuiz() {
    switchTab('home');
    updateStats();
  }
</script>
