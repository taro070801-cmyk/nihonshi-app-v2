<script>
  // 時代別の正答率・苦手集計
  function renderEraStats() {
    const container = document.getElementById('eraStatsList');
    if (!container || typeof QUESTIONS === 'undefined') return;

    const eraMap = {};
    QUESTIONS.forEach(q => {
      const h = history[q.id];
      if (!h || h.count <= 0) return;

      const cat = MAPPING_RULES.find(c => q.id >= c.idStart && q.id <= c.idEnd);
      const eraName = cat ? cat.era : (q.era || 'その他');
      if (!eraMap[eraName]) eraMap[eraName] = { correct: 0, total: 0 };

      eraMap[eraName].total += h.count;
      eraMap[eraName].correct += h.correctCount || 0;
    });

    const eras = Object.keys(eraMap);
    if (eras.length === 0) {
      container.innerHTML = '<p style=\"color:#666;font-size:.9em;\">まだ解答データがありません。</p>';
      return;
    }

    container.innerHTML = eras.map(era => {
      const data = eraMap[era];
      const rate = data.total ? Math.round((data.correct / data.total) * 100) : 0;
      const label = rate < 60 ? '⚠️ 苦手' : rate < 80 ? '要確認' : '良好';
      return `
        <div style=\"border:1px solid #eee;padding:8px 12px;border-radius:8px;background:#fafafa;\">
          <div style=\"display:flex;justify-content:space-between;align-items:center;font-size:.9em;font-weight:bold;margin-bottom:4px;\">
            <span>${escapeHtml(era)}</span><span>${label} (${rate}%)</span>
          </div>
          <div style=\"background:#e5e5ea;height:6px;border-radius:3px;overflow:hidden;\">
            <div style=\"width:${rate}%;height:100%;\"></div>
          </div>
        </div>`;
    }).join('');
  }
</script>
